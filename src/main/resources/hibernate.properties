# ==========================================
# Serenity Mental Health Therapy Center
# Hibernate Property File Configuration
# ==========================================

# === Database Connection ===
hibernate.connection.driver_class=com.mysql.cj.jdbc.Driver
hibernate.connection.url=jdbc:mysql://localhost:3306/serenity_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
hibernate.connection.username=root
hibernate.connection.password=1234

# === Hibernate Dialect ===
hibernate.dialect=org.hibernate.dialect.MySQLDialect

# === DDL Auto ===
# create
# create-drop
# update
# validate
hibernate.hbm2ddl.auto=update

# === SQL Logging (dev mode) ===
hibernate.show_sql=true
hibernate.format_sql=true

# === Connection Pool ===
hibernate.connection.pool_size=10

# === Session Context ===
hibernate.current_session_context_class=thread